name: pr-checks

# Portão de qualidade antes do merge na main — o único gate deste repo solo.
# Dispara no push das branches de trabalho (inclui worktree/** geradas por
# agente). Quando todos os checks ficam verdes, open-pr abre o PR para a main.
# Merge autônomo no verde — o agente mergeia diretamente sem esperar operador
# (ADR-0014).
#
# CD: deploy.yml dispara no push à main e aciona a API do Coolify para buildar
# e subir o novo commit (ADR-0004). O Coolify clona o repo e builda o
# Dockerfile da raiz — não há build de imagem GHCR neste pipeline.

on:
  push:
    branches:
      - "feat/**"
      - "fix/**"
      - "chore/**"
      - "docs/**"
      - "refactor/**"
      - "test/**"
      - "ci/**"
      - "worktree/**"

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: lint (biome)
        run: npm run lint
      - name: typecheck (tsc)
        run: npm run typecheck
      - name: test (vitest)
        run: npm test
      - name: build (next)
        run: npm run build

  security:
    name: security
    runs-on: ubuntu-latest
    # A action gitleaks/gitleaks-action exige licenca paga quando o repo
    # pertence a uma organizacao ("[org] is an organization. License key is
    # required."), o que passou a valer ao transferir panlabs para
    # panlabs-tech. O binario gitleaks e MIT e nao tem essa restricao, entao
    # usamos ele direto: versao fixada e checksum conferido antes de executar.
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: instalar gitleaks
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum --check --status
          sudo tar -xzf "$tarball" -C /usr/local/bin gitleaks
          rm -f "$tarball"
          gitleaks version
      - name: gitleaks (historico completo)
        run: gitleaks git . --redact --verbose

  open-pr:
    name: open-pr
    needs: [checks, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Abrir PR para a main se ainda nao existir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ "$(gh pr list --head "$BRANCH" --base main --state open --json number --jq 'length')" -ne 0 ]; then
            echo "::notice::Ja existe PR aberto de $BRANCH para a main."
            exit 0
          fi

          git fetch --quiet origin main
          if [ "$(git rev-list --count FETCH_HEAD..HEAD)" -eq 0 ]; then
            echo "::notice::$BRANCH nao tem commits novos sobre a main."
            exit 0
          fi

          title="$(git log "FETCH_HEAD..HEAD" --pretty=%s | head -n1 || true)"
          [ -z "$title" ] && title="$(git log -1 --pretty=%s)"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "$title" \
            --body "PR aberto automaticamente após checks verdes. Merge autônomo no verde — agente faz o merge diretamente sem esperar operador."

          echo "::notice::PR aberto: $BRANCH -> main"
