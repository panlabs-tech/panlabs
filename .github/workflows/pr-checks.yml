name: pr-checks

# Portão 2, na CI, antes do merge na main. O portão 1 é local, antes do commit
# (`lefthook.yml`).
#
# Este arquivo é um **caller**: ele referencia os reusable workflows publicados
# em `panlabs-tech/.github` em vez de carregar a lógica. A cópia era o problema
# medido: os quatro arquivos de CI da frota nasceram copiados um do outro e
# divergiram entre 48% e 86% em sete semanas, então origem comum não impede
# deriva (panlabs-tech/.github#7).
#
# A referência pina a **tag exata**, nunca uma tag flutuante como `@v1`: uma
# mudança na CI compartilhada não pode quebrar todos os consumidores ao mesmo
# tempo sem aviso. Subir de tag é, hoje, edição manual desta linha: este repo
# ainda não tem `.github/dependabot.yml` declarando o ecossistema
# `github-actions`, que é o que abriria o PR de bump sozinho.
#
# CD: `deploy.yml` dispara no push à main e aciona a API do Coolify para buildar
# e subir o commit novo. Não há build de imagem GHCR neste pipeline.

on:
  push:
    branches:
      - "feat/**"
      - "fix/**"
      - "chore/**"
      - "docs/**"
      - "refactor/**"
      - "test/**"
      - "ci/**"
      - "worktree/**"
      # A ferramenta de worktree do Claude Code gera branch com hífen
      # (`worktree-<nome>`), não com barra.
      - "worktree-**"
      # A raiz de branch do Dependabot, que não é configurável. Sem esta linha o
      # PR do bot não dispara checagem nenhuma e os required checks nunca saem,
      # e o PR fica pendurado esperando um status que ninguém vai publicar.
      # Não é linha preventiva: as atualizações de segurança do Dependabot já
      # abrem PR aqui sem depender de `.github/dependabot.yml`, e havia duas
      # branches `dependabot/**` vivas no remoto quando esta linha foi escrita.
      - "dependabot/**"

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A perna da única superfície deste repo. O nome do job é contrato: é ele que
  # o rollup lista em `needs`, e é ele que o checker de conformidade da org
  # procura ao cobrar que a superfície Node tenha perna declarada. Uma perna que
  # não está aqui sai verde sem ter rodado nada.
  #
  # `working-directory: .` e não `apps/web`: o workspace pnpm instala do
  # lockfile da raiz, e os scripts da raiz (`lint`, `typecheck`, `test`,
  # `build`) delegam para a aplicação.
  checks-node:
    name: checks-node
    uses: panlabs-tech/.github/.github/workflows/checks-node.yml@v1.0.0
    with:
      package-manager: pnpm
      working-directory: .

  # O rollup: id fixo, `needs` sobre as pernas por superfície deste repo.
  # `if: always()` mais checagem explícita do resultado, para que uma perna
  # reprovada **reprove** o rollup em vez de pulá-lo: pulado não é reprovado, e
  # é esse o footgun que mata o desenho ingênuo. O mesmo cálculo é modelado e
  # testado em Python, em `panlabs.ci.rollup.rollup_conclusion`, no repo meta.
  checks:
    name: checks
    needs: [checks-node]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: agregar o resultado das pernas por superfície
        run: |
          set -euo pipefail
          result="${{ needs.checks-node.result }}"
          if [[ "$result" != "success" && "$result" != "skipped" ]]; then
            echo "::error::checks-node reprovou (${result})."
            exit 1
          fi

  security-scan:
    uses: panlabs-tech/.github/.github/workflows/security.yml@v1.0.0

  # Job de fachada em volta de `security-scan`, e não um rollup de superfícies
  # (só existe um scan de segredos possível por repo). Existe porque um job que
  # chama um reusable workflow via `uses:` publica o check com o nome
  # "<job do caller> / <job do workflow chamado>", nunca só o nome do job do
  # caller: comportamento do GitHub Actions, sem opção para suprimir. Sem esta
  # fachada, o required check `security` da org nunca existiria com esse nome.
  security:
    name: security
    needs: [security-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: agregar o resultado do scan
        run: |
          set -euo pipefail
          result="${{ needs.security-scan.result }}"
          if [[ "$result" != "success" && "$result" != "skipped" ]]; then
            echo "::error::security-scan reprovou (${result})."
            exit 1
          fi

  # O Dependabot já abre o próprio PR: rodar `open-pr` na branch dele seria, no
  # melhor caso, ruído, e no pior, corrida com quem abriu primeiro. A condição
  # não afrouxa o gate porque `open-pr` nunca foi required (seria circular: é o
  # job que cria o PR).
  open-pr:
    name: open-pr
    needs: [checks, security]
    if: github.actor != 'dependabot[bot]'
    uses: panlabs-tech/.github/.github/workflows/open-pr.yml@v1.0.0
    permissions:
      contents: read
      pull-requests: write
